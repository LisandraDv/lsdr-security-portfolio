name: "02 - IaC Security and Policy as Code"

on:
  push:
    branches:
      - main
    paths:
      - "02-iac-security-policy-as-code/**"
      - ".github/workflows/02-iac-security.yml"

  pull_request:
    paths:
      - "02-iac-security-policy-as-code/**"
      - ".github/workflows/02-iac-security.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  terraform-validation:
    name: Terraform Validate - ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - vulnerable-infra
          - secure-infra

    defaults:
      run:
        working-directory: 02-iac-security-policy-as-code/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color


  vulnerable-iac-scan:
    name: Checkov - Vulnerable Infrastructure
    runs-on: ubuntu-latest
    needs: terraform-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Checkov against vulnerable infrastructure
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            bridgecrew/checkov:3 \
            -d /repo/02-iac-security-policy-as-code/vulnerable-infra \
            --framework terraform \
            --compact \
            --soft-fail

      - name: Expected findings notice
        run: |
          echo "The vulnerable-infra directory intentionally contains insecure Azure configurations."
          echo "Checkov findings in this job are expected and do not block the pipeline."


  secure-iac-security-gate:
    name: Checkov - Secure Infrastructure Gate
    runs-on: ubuntu-latest
    needs: terraform-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Checkov security gate
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            bridgecrew/checkov:3 \
            -d /repo/02-iac-security-policy-as-code/secure-infra \
            --framework terraform \
            --compact

      - name: Security gate passed
        run: |
          echo "Secure infrastructure passed the Checkov security gate."


  policy-as-code-validation:
    name: Azure Policy as Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Azure Policy JSON files
        shell: bash
        run: |
          set -e

          for policy in 02-iac-security-policy-as-code/policies/*.json; do
            echo "Validating: $policy"

            jq empty "$policy"

            jq -e '
              .properties.displayName != null
              and .properties.mode != null
              and .properties.policyRule.if != null
              and .properties.policyRule.then.effect == "deny"
            ' "$policy" > /dev/null

            echo "Policy valid: $policy"
          done

      - name: Policy validation passed
        run: |
          echo "All Azure Policy definitions are valid."